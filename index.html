<!DOCTYPE html>
<html lang="vi">
<head>

    <title>CMMS App - Mô phỏng Hoàn chỉnh</title>
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="CMMS Pro - Ứng dụng quản lý bảo trì thiết bị, linh kiện, báo lỗi, kỹ thuật viên.">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library for Real QR Code Scanning -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .view { display: none; }
        .view.active { display: block; }
        .main-container { display: none; }
        .main-container.active { display: flex; }
        .star-rating label { color: #d1d5db; cursor: pointer; font-size: 2.5rem; transition: color 0.2s; }
        .star-rating input:checked ~ label, .star-rating label:hover, .star-rating label:hover ~ label { color: #f59e0b; }
        .tab-button.active { border-color: #3b82f6; color: #3b82f6; background-color: #eff6ff; }
        .nav-link.active { background-color: #111827; }
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Login & Register Views -->
    <div id="auth-view" class="view active flex items-center justify-center h-screen">
        <div id="login-container" class="w-full max-w-sm">
            <div class="p-8 bg-white shadow-lg rounded-lg">
                <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">CMMS Pro</h2>
                <p class="text-center text-gray-500 mb-8">Đăng nhập để tiếp tục</p>
                <div class="space-y-4">
                    <div>
                        <label for="login-name" class="text-sm font-medium text-gray-700">Tên đăng nhập</label>
                        <input id="login-name" type="text" placeholder="vd: quanly" class="w-full p-3 mt-1 border border-gray-300 rounded-lg">
                    </div>
                    <div>
                        <label for="login-password" class="text-sm font-medium text-gray-700">Mật khẩu</label>
                        <input id="login-password" type="password" placeholder="Mật khẩu là: 123" class="w-full p-3 mt-1 border border-gray-300 rounded-lg">
                    </div>
                    <button id="login-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700">Đăng nhập</button>
                    <p class="text-xs text-center text-gray-400 pt-2">Tên mẫu: congnhan, kythuat, quanly</p>
                </div>
            </div>
            <p class="text-center mt-4 text-sm">Chưa có tài khoản? <button id="show-register-btn" class="font-semibold text-blue-600 hover:underline">Đăng ký ngay</button></p>
        </div>

        <div id="register-container" class="w-full max-w-sm hidden">
            <div class="p-8 bg-white shadow-lg rounded-lg">
                <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Đăng ký thành viên</h2>
                <div class="space-y-4">
                    <input id="register-name" type="text" placeholder="Tên đăng nhập" class="w-full p-3 border border-gray-300 rounded-lg">
                    <input id="register-password" type="password" placeholder="Mật khẩu" class="w-full p-3 border border-gray-300 rounded-lg">
                    <button id="register-btn" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700">Gửi Yêu cầu Đăng ký</button>
                </div>
            </div>
            <p class="text-center mt-4 text-sm">Đã có tài khoản? <button id="show-login-btn" class="font-semibold text-blue-600 hover:underline">Đăng nhập</button></p>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="main-container h-screen"></div>

</html>
